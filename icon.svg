<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#gold)" stroke-width="12"/>

  <!-- Track Ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#334155" stroke-width="45"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="14 12"/>

  <!-- Checkered Finish Line at top -->
  <g transform="translate(244, 58)">
    <rect x="0" y="0" width="12" height="11" fill="#fff"/>
    <rect x="12" y="0" width="12" height="11" fill="#000"/>
    <rect x="0" y="11" width="12" height="11" fill="#000"/>
    <rect x="12" y="11" width="12" height="11" fill="#fff"/>
    <rect x="0" y="22" width="12" height="11" fill="#fff"/>
    <rect x="12" y="22" width="12" height="11" fill="#000"/>
    <rect x="0" y="33" width="12" height="11" fill="#000"/>
    <rect x="12" y="33" width="12" height="11" fill="#fff"/>
  </g>

  <!-- Center Emoji Dragon / Mascot -->
  <text x="256" y="275" font-size="120" text-anchor="middle" dominant-baseline="middle">🐉</text>

  <!-- Racing Car / Racer on Track -->
  <g transform="translate(415, 230)">
    <circle cx="0" cy="0" r="28" fill="#ffd166" stroke="#fff" stroke-width="3"/>
    <text x="0" y="4" font-size="28" text-anchor="middle" dominant-baseline="middle">⚡</text>
  </g>

  <!-- Title Text Arc / Ribbon -->
  <rect x="96" y="380" width="320" height="46" rx="23" fill="#1e293b" stroke="url(#gold)" stroke-width="3"/>
  <text x="256" y="411" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffd166" text-anchor="middle" letter-spacing="2">ZODIAC RACING</text>
</svg>
